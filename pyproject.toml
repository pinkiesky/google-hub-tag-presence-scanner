[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cat-tracker"
version = "1.0.0"
description = "Local Find Hub BLE presence monitoring with Telegram alerts"
requires-python = ">=3.11"
dependencies = ["bleak>=3.0,<4", "pycryptodomex>=3.20,<4", "ecdsa>=0.19,<1", "httpx>=0.27,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.11", "mypy>=1.15", "cryptography>=44"]

[project.scripts]
cat-tracker = "cat_tracker.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
